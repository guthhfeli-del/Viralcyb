services:
  viralcyb:
    build:
      context: .
      args:
        # Engines baked into the image (see server/requirements-engines.txt).
        ENGINES: "matchering"
    ports:
      - "8000:8000"
    environment:
      # Lyric variants + Whisper transcription (OpenRouter), read from .env
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      VIRALCYB_OPENROUTER_MODEL: ${VIRALCYB_OPENROUTER_MODEL:-anthropic/claude-opus-5}
      # Alternative: Anthropic API directly
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Restrict in production, e.g. https://viralcyb.app
      VIRALCYB_ALLOWED_ORIGINS: ${VIRALCYB_ALLOWED_ORIGINS:-*}
      VIRALCYB_WHISPER_MODEL: ${VIRALCYB_WHISPER_MODEL:-small}
      # ACE-Step 1.5 API server (see server/README.md)
      VIRALCYB_ACESTEP_URL: ${VIRALCYB_ACESTEP_URL:-}
    volumes:
      - viralcyb-data:/data
    restart: unless-stopped

volumes:
  viralcyb-data:
